# Mo v2 CI, uploaded by the `buildkite-agent pipeline upload` step in the
# robert-guss/mo-v2 pipeline. See .buildkite/README.md for what runs and why.
#
# Queue: `linux-small` is the Default cluster's default hosted queue, and it
# fits. Neither step is limited by cores or memory -- measured peaks are 625 MB
# for Rust and 535 MB for Lean, and the longest command in the build
# (`leanchecker --fresh`, about 50s) is strictly single-threaded, so a larger
# queue would cost more without shortening the critical path. Override with
# MO_CI_QUEUE in Pipeline Settings -> Environment Variables.

agents:
  queue: "${MO_CI_QUEUE:-linux-small}"

steps:
  - label: ":rust: Rust builds and frozen corpora"
    key: rust
    command: .buildkite/checks.sh rust
    artifact_paths:
      - "ci-evidence/**/*"
    timeout_in_minutes: 20

  - label: ":lean: Lean proofs and kernel re-check"
    key: lean
    command: .buildkite/checks.sh lean
    artifact_paths:
      - "ci-evidence/**/*"
    timeout_in_minutes: 30
