# Mo v2 CI. Uploaded by the pipeline steps in the Buildkite UI, which hold only:
#
#   steps:
#     - command: buildkite-agent pipeline upload
#
# See .buildkite/README.md for what runs, what does not, and why.
#
# Agent queue: set MO_CI_QUEUE in Pipeline Settings -> Environment Variables to
# target a hosted queue by another name. The default, `default`, is the queue
# name Buildkite creates with a new cluster.

agents:
  queue: "${MO_CI_QUEUE:-default}"

steps:
  - label: ":rust: Rust builds and frozen corpora"
    key: rust
    command: .buildkite/checks.sh rust
    artifact_paths:
      - "ci-evidence/**/*"
    timeout_in_minutes: 20

  - label: ":lean: Lean proofs and kernel re-check"
    key: lean
    command: .buildkite/checks.sh lean
    artifact_paths:
      - "ci-evidence/**/*"
    timeout_in_minutes: 30
